name: Validation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'schema'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm install
      - run: npm test
